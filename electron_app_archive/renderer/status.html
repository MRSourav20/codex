<!DOCTYPE html>
<html>

<head>
    <title>Optimus - Monitoring Active</title>
    <style>
        :root {
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --bg-base: #020617;
            --bg-glass: rgba(15, 23, 42, 0.7);
            --border-glass: rgba(56, 189, 248, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.1);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top left, #0f172a, var(--bg-base) 80%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Animated Grid Background */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 100%;
            }
        }

        .card {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(56, 189, 248, 0.1) inset;
            width: 360px;
            text-align: center;
            z-index: 10;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            background: var(--success-bg);
            color: var(--success);
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 2rem;
            border: 1px solid rgba(52, 211, 153, 0.3);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .pulse {
            animation: pulse-animation 2s infinite;
            margin-right: 8px;
            font-size: 1.2rem;
        }

        @keyframes pulse-animation {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            color: var(--text-main);
            margin: 0 0 0.5rem;
            font-size: 1.6rem;
            font-weight: 800;
        }

        p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .metrics-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 1.2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: left;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            align-items: center;
        }

        .metric:last-child {
            margin-bottom: 0;
        }

        .value {
            color: var(--text-main);
            font-family: 'Consolas', monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--danger);
            background: var(--danger-bg);
            color: var(--danger);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: var(--danger);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(239, 68, 68, 0.4);
        }

        button:disabled {
            background: #334155;
            border-color: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="status-badge"><span class="pulse">●</span> SHIELD ACTIVE</div>
        <h1>Interview Session</h1>
        <p>WireGuard tunnel validated. Your traffic should now route through the Optimus EC2 gateway.</p>

        <div class="metrics-container">
            <div class="metric">
                <span>Session ID:</span>
                <span class="value" id="disp-session-id">----</span>
            </div>
            <div class="metric">
                <span>Tunnel IP:</span>
                <span class="value" id="disp-client-ip" style="color: var(--primary);">0.0.0.0</span>
            </div>
            <div class="metric">
                <span>WG Interface:</span>
                <span class="value" id="disp-wg-iface">----</span>
            </div>
            <div class="metric">
                <span>Intelligence API:</span>
                <span class="value" style="color: var(--success); background: transparent; padding: 0;">Connected</span>
            </div>
        </div>

        <button id="disconnect-btn">Terminate Session</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);

        // Handle ID shortening for UI purposes
        const fullId = urlParams.get('id') || 'N/A';
        const dispId = fullId.length > 12 ? fullId.substring(0, 12) + '...' : fullId;

        document.getElementById('disp-session-id').innerText = dispId;
        document.getElementById('disp-client-ip').innerText = urlParams.get('ip') || 'N/A';
        document.getElementById('disp-wg-iface').innerText = urlParams.get('iface') || 'N/A';

        document.getElementById('disconnect-btn').addEventListener('click', async () => {
            const btn = document.getElementById('disconnect-btn');
            btn.disabled = true;
            btn.innerText = 'Purging Tunnel...';
            const result = await window.coadex.endSession();
            if (result.success) {
                window.location.href = 'index.html';
            } else {
                alert('Closure Warning: ' + (result.errors || []).join(', '));
                btn.disabled = false;
                btn.innerText = 'Terminate Session';
            }
        });
    </script>
</body>

</html>
